<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BinMaster Letter Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .sent-btn { background-color: #059669 !important; border-color: #059669 !important; }
        pre { white-space: pre-wrap; font-family: ui-sans-serif, system-ui, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-lg">
        <h1 class="text-2xl font-bold mb-2 text-blue-900">BinMaster Letter Builder</h1>
        <p class="text-sm text-gray-600 mb-6">Paste order data below. Keywords are now case-insensitive (e.g., "cncr" or "CNCR").</p>
        
        <textarea id="input" rows="8" class="w-full p-4 border-2 border-gray-200 rounded-lg mb-4 outline-none focus:border-blue-500" placeholder="Paste order data here..."></textarea>
        <button onclick="build()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition shadow">Generate Emails</button>

        <div id="results" class="mt-8 space-y-6"></div>
    </div>

    <script>
        // Full Resource Map directly from your spreadsheet
        const resourceMap = {
            "BMRX": ["• Rotary Manual: https://support.binmaster.com/kb/view/66e6b142-438c-4f2f-85c2-bda53cba000f", "• Rotary scenarios: https://support.binmaster.com/kb/view/809dda8f-1de8-44ae-af07-fe2865c03113"],
            "3D Extension": ["• Video & Manual: https://support.binmaster.com/kb/view/70cbec26-fa02-4934-a95c-593cf5092229"],
            "3D Scanner": ["• 3D Wiring: https://support.binmaster.com/kb/view/52912f26-04f4-4aeb-b3ba-10db7226afcd", "• 3D Vision TCP Connect: https://support.binmaster.com/kb/view/7d8bee17-d629-4075-a18b-7e0725f4b52a", "• 3D Manual: https://support.binmaster.com/kb/view/c33bfffd-6111-4b65-961c-17a2b1797374"],
            "BinCloud": ["• Video: https://support.binmaster.com/kb/view/8f64f604-a14e-4e36-8cba-4d01bc248b99", "• Vessel Measurement Form: https://support.binmaster.com/kb/view/d65c70fd-45a6-4720-9db6-de9f61348bae", "• BinCloud Firewall Rules: https://support.binmaster.com/kb/view/6eba9a1b-a15f-4ef6-b96b-c50478438d5d"],
            "Bindisc": ["• Video: https://support.binmaster.com/kb/view/0267ba21-6439-408a-b1f5-1e5963f3fe16", "• Setup Guide: https://support.binmaster.com/kb/view/ca0065b4-4870-4586-b804-350da88e5572"],
            "C100": ["• Manual: https://support.binmaster.com/kb/view/811e6e4d-81ec-4906-be46-981773c71a69", "• Setup Guide: https://support.binmaster.com/kb/view/0dc92929-2d30-459f-b9a0-6747115ed366"],
            "C50": ["• Manual: https://support.binmaster.com/kb/view/1faee569-f5e9-442c-9c58-99fc3d0c1213"],
            "CNCR": ["• Manual: https://support.binmaster.com/kb/view/d71297d9-77ac-49f8-97a4-6d183bf3adbc", "• Wiring: https://support.binmaster.com/kb/view/9ab4c1b8-9795-4e4a-90a7-192da74a5729", "• Distance explanation: https://support.binmaster.com/kb/view/354aa685-9ca4-429e-bc12-c8133f120720", "• Bluetooth setup", "• Vessel Measurement Form: https://support.binmaster.com/kb/view/d65c70fd-45a6-4720-9db6-de9f61348bae"],
            "CNCR 320": ["• Manual: https://support.binmaster.com/kb/view/db8c1c3b-9a46-48eb-b1b3-6d55837d048c", "• Distance explanation: https://support.binmaster.com/kb/view/354aa685-9ca4-429e-bc12-c8133f120720", "• Vessel Measurement Form: https://support.binmaster.com/kb/view/d65c70fd-45a6-4720-9db6-de9f61348bae"],
            "CNCR 390": ["• Manual: https://support.binmaster.com/kb/view/db8c1c3b-9a46-48eb-b1b3-6d55837d048c", "• Distance explanation: https://support.binmaster.com/kb/view/354aa685-9ca4-429e-bc12-c8133f120720", "• Vessel Measurement Form: https://support.binmaster.com/kb/view/d65c70fd-45a6-4720-9db6-de9f61348bae"],
            "DPM": ["• Manual: https://support.binmaster.com/kb/view/717dead8-a1c3-4518-8238-857ecac445e3"],
            "FD2000": ["• Manual: https://support.binmaster.com/kb/view/abb5c846-af70-48bd-a9ba-5ca6de0579cc"],
            "Gateway": ["• Manual: https://binmaster.com/network-devices"],
            "Guided Wave Radar": ["• Manual: https://support.binmaster.com/kb/view/e29fbc11-0526-4ff9-9c76-da324a5a9ca3", "• Wiring: https://support.binmaster.com/kb/view/baa0c650-0575-4b4f-a0dc-86911ca25a66"],
            "LTX": ["• Vessel Measurement Form: https://support.binmaster.com/kb/view/d65c70fd-45a6-4720-9db6-de9f61348bae"],
            "NCR": ["• Manual: https://support.binmaster.com/kb/view/bc8e6a67-a401-4bc6-aa83-3423a0282860", "• Wiring: https://support.binmaster.com/kb/view/a5d3b4e0-a336-43f4-94f4-962eeef7d7af", "• Distance explanation: https://support.binmaster.com/kb/view/354aa685-9ca4-429e-bc12-c8133f120720", "• Bindisc setup", "• Vessel Measurement Form: https://support.binmaster.com/kb/view/d65c70fd-45a6-4720-9db6-de9f61348bae"],
            "ProCap": ["• Manual: https://support.binmaster.com/kb/view/4895275b-1f7c-4b28-8fec-925faa017f46", "• Wiring: https://support.binmaster.com/kb/view/c67bbd67-e00b-46ef-9f72-38a83856a103"],
            "SmartBob AO": ["• Manual: https://support.binmaster.com/kb/view/c63c227b-5e08-4171-8c7f-58a804e3f06a", "• Wiring: https://support.binmaster.com/kb/view/3ae8f673-3dfd-466f-b9fd-2e814996426a"],
            "SmartBob II": ["• Manual: https://support.binmaster.com/kb/view/c63c227b-5e08-4171-8c7f-58a804e3f06a", "• Wiring: https://support.binmaster.com/kb/view/3ae8f673-3dfd-466f-b9fd-2e814996426a"],
            "Toughsonic 100": ["• Manual: https://support.binmaster.com/kb/view/376df1e4-4906-4f01-b9e6-c4e8e0943da0", "• Video: https://support.binmaster.com/kb/view/82db282a-4422-4630-8643-a0dc2cf61ff2", "• Video tutorial: https://support.binmaster.com/kb/view/781b5dbb-c006-40a3-8754-9a55f4392456"],
            "Toughsonic 200": ["• Manual: https://support.binmaster.com/kb/view/376df1e4-4906-4f01-b9e6-c4e8e0943da0", "• Video: https://support.binmaster.com/kb/view/82db282a-4422-4630-8643-a0dc2cf61ff2", "• Video tutorial: https://support.binmaster.com/kb/view/781b5dbb-c006-40a3-8754-9a55f4392456"]
        };

        function build() {
            const text = document.getElementById('input').value;
            const container = document.getElementById('results');
            container.innerHTML = '';
            const history = JSON.parse(localStorage.getItem('sent_log') || '[]');

            const parts = text.split(/(ORD-\d{2}-\d{5})/g);
            
            for (let i = 1; i < parts.length; i += 2) {
                const ordNum = parts[i];
                const content = parts[i+1] || "";
                let foundLinks = [];
                let itemsList = [];
                
                for (const [key, links] of Object.entries(resourceMap)) {
                    // Case-insensitive boundary search to separate NCR and CNCR correctly
                    const regex = new RegExp("\\b" + key + "\\b", "i");
                    
                    if (regex.test(content)) {
                        itemsList.push(key);
                        links.forEach(l => foundLinks.push(l));
                    }
                }

                const itemsFoundStr = [...new Set(itemsList)].join(', ');
                const linksStr = [...new Set(foundLinks)].join('\n');
                const customerMatch = content.match(/[A-Za-z ]{3,}/);
                const customer = customerMatch ? customerMatch[0].trim() : "Customer";

                const subject = `${ordNum} ${customer}`;
                const body = `${itemsFoundStr}\n\nGreetings!\n\nThanks again for choosing BinMaster for your state-of-the-art level measurement system. Looking ahead to your system, we figure you could use some resources.\n\n${linksStr}\n\nRemember to bookmark https://support.binmaster.com/ if you need to chat, search our knowledge base, or contact BinMaster Tech. Protip: Water and sensors do not mix. Check your seals. Anticipate water intrusion from conduits. Ask your installer to double check.\n\nBINMASTER TECHNICAL SUPPORT TEAM\n402-434-9105\ntechnicalsupport@binmaster.com\nsupport.binmaster.com`;

                const isSent = history.includes(ordNum);
                const btnId = `btn-${i}`;
                const card = document.createElement('div');
                card.className = "p-6 border-2 border-gray-100 rounded-xl bg-gray-50 mb-6 shadow-sm";
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="font-bold text-lg text-blue-800">${ordNum} - ${customer}</h2>
                        <button id="${btnId}" onclick="sendMail('${ordNum}', \`${encodeURIComponent(subject)}\`, \`${encodeURIComponent(body)}\`, '${btnId}')" 
                                class="px-6 py-2 rounded-lg text-white font-bold transition ${isSent ? 'sent-btn' : 'bg-blue-600 hover:bg-blue-700'}">
                            ${isSent ? 'Sent - Resend?' : 'Open Email'}
                        </button>
                    </div>
                    <pre class="text-sm border p-4 bg-white rounded-lg text-gray-700 leading-relaxed">${body}</pre>
                `;
                container.appendChild(card);
            }
        }

        function sendMail(id, sub, body, btnId) {
            window.location.href = `mailto:?subject=${sub}&body=${body}`;
            let history = JSON.parse(localStorage.getItem('sent_log') || '[]');
            if (!history.includes(id)) {
                history.push(id);
                localStorage.setItem('sent_log', JSON.stringify(history));
            }
            const btn = document.getElementById(btnId);
            btn.classList.add('sent-btn');
            btn.innerText = 'Sent - Resend?';
        }
    </script>
</body>
</html>
