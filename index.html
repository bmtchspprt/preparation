<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BinMaster Letter Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .sent-btn { background-color: #059669 !important; border-color: #059669 !important; }
        pre { white-space: pre-wrap; font-family: ui-sans-serif, system-ui, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-lg">
        <h1 class="text-2xl font-bold mb-2 text-blue-900">BinMaster Letter Builder</h1>
        <p class="text-sm text-gray-600 mb-6">Paste PDF or Excel rows below to generate formatted emails.</p>
        
        <textarea id="input" rows="8" class="w-full p-4 border-2 border-gray-200 rounded-lg mb-4 focus:border-blue-500 outline-none" placeholder="Paste order data here..."></textarea>
        <button onclick="build()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition shadow">Generate Emails</button>

        <div id="results" class="mt-8 space-y-6"></div>
    </div>

    <script>
        // Data pulled directly from your "BinMaster Preparation Letter" CSV
        const resourceMap = {
            "BMRX": ["Rotary Manual", "Rotary scenarios"],
            "3D Scanner": ["3D Wiring", "3D Vision TCP Connect", "3D Manual"],
            "BinCloud": ["Video", "Vessel Measurement Form", "BinCloud Firewall Rules"],
            "CNCR": ["Manual", "Wiring", "Distance explanation", "Bluetooth setup", "Vessel Measurement Form"],
            "NCR": ["Manual", "Wiring", "Distance explanation", "Bindisc setup", "Vessel Measurement Form"],
            "ProCap": ["Manual", "Wiring"],
            "SmartBob": ["Manual", "Wiring"],
            "GRP": ["Single bayonet blade manual"],
            "GRMP": ["Mounting plate guide"]
        };

        function build() {
            const text = document.getElementById('input').value;
            const container = document.getElementById('results');
            container.innerHTML = '';
            const history = JSON.parse(localStorage.getItem('sent_log') || '[]');

            // Split by Order Number to group multiple items together
            const parts = text.split(/(ORD-\d{2}-\d{5})/g);
            
            for (let i = 1; i < parts.length; i += 2) {
                const ordNum = parts[i];
                const content = parts[i+1] || "";
                
                let foundLinks = [];
                let itemsList = [];
                
                // Scan the block of text for keywords
                for (const [key, labels] of Object.entries(resourceMap)) {
                    if (content.toUpperCase().includes(key.toUpperCase())) {
                        itemsList.push(key);
                        labels.forEach(label => {
                            foundLinks.push(`${key} - ${label} (https://support.binmaster.com)`);
                        });
                    }
                }

                const customerMatch = content.match(/[A-Za-z ]{3,}/);
                const customer = customerMatch ? customerMatch[0].trim() : "Customer";
                const subject = `${ordNum} ${customer}`;
                const itemsFoundStr = [...new Set(itemsList)].join(', ');
                const linksStr = [...new Set(foundLinks)].join('\n');

                const body = `${itemsFoundStr}\n\nThanks again for choosing BinMaster for your state-of-the-art level measurement system. Looking ahead to your system, we figure you could use some resources.\n\n${linksStr}\n\nRemember to bookmark https://support.binmaster.com/ if you need to chat, search our knowledge base, or contact BinMaster Tech. Protip: Water and sensors do not mix. Check your seals. Anticipate water intrusion from conduits. Ask your installer to double check.\n\nBinMaster Technical Support Team\n402-434-9105\ntechnicalsupport@binmaster.com\nsupport.binmaster.com`;

                const isSent = history.includes(ordNum);
                const btnId = `btn-${i}`;
                const card = document.createElement('div');
                card.className = "p-6 border-2 border-gray-100 rounded-xl bg-gray-50 shadow-sm";
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="font-bold text-lg text-blue-800">${ordNum} - ${customer}</h2>
                        <button id="${btnId}" onclick="sendMail('${ordNum}', \`${encodeURIComponent(subject)}\`, \`${encodeURIComponent(body)}\`, '${btnId}')" 
                                class="px-6 py-2 rounded-lg text-white font-bold transition ${isSent ? 'sent-btn' : 'bg-blue-500 hover:bg-blue-600'}">
                            ${isSent ? 'Sent - Open Again?' : 'Open Email'}
                        </button>
                    </div>
                    <pre class="text-sm border p-4 bg-white rounded-lg text-gray-700 leading-relaxed">${body}</pre>
                `;
                container.appendChild(card);
            }
        }

        function sendMail(id, sub, body, btnId) {
            // Using %0D%0A for mailto line breaks to ensure Outlook/Gmail compatibility
            window.location.href = `mailto:?subject=${sub}&body=${body}`;
            
            let history = JSON.parse(localStorage.getItem('sent_log') || '[]');
            if (!history.includes(id)) {
                history.push(id);
                localStorage.setItem('sent_log', JSON.stringify(history));
            }
            const btn = document.getElementById(btnId);
            btn.classList.add('sent-btn');
            btn.innerText = 'Sent - Open Again?';
        }
    </script>
</body>
</html>
