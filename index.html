<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BinMaster Letter Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .sent-btn { background-color: #059669 !important; } /* Green-600 */
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-10">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-lg">
        <h1 class="text-3xl font-bold text-blue-900 mb-2">Letter Builder</h1>
        <p class="text-gray-600 mb-6">Paste your order data below to generate resources emails.</p>

        <div class="mb-8">
            <textarea id="orderInput" rows="6" class="w-full p-4 border-2 border-gray-200 rounded-lg focus:border-blue-500 focus:outline-none" 
                placeholder="Paste PDF text or Excel rows here..."></textarea>
            <div class="flex gap-4 mt-4">
                <button onclick="generateLetters()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition">
                    Generate Letters
                </button>
                <button onclick="clearHistory()" class="text-red-500 text-sm hover:underline">
                    Clear Sent History
                </button>
            </div>
        </div>

        <div id="duplicateAlert" class="hidden mb-6 p-4 bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700">
            <strong>Note:</strong> Some orders were already processed and are marked in green.
        </div>

        <div id="letterContainer" class="space-y-6"></div>
    </div>

    <script>
        // Mapping Table: Keyword -> Links
        const resourceMap = {
            "BMRX": ["Rotary Manual", "Rotary Scenarios"],
            "CNCR": ["Manual", "Wiring", "Distance explanation", "Bluetooth setup"],
            "ProCap": ["Manual", "Wiring"],
            "GRP": ["Single bayonet blade manual"],
            "GRMP": ["Mounting plate guide"]
        };

        function getHistory() {
            return JSON.parse(localStorage.getItem('sentOrders') || '[]');
        }

        function markAsSent(orderId, btnId) {
            let history = getHistory();
            if (!history.includes(orderId)) {
                history.push(orderId);
                localStorage.setItem('sentOrders', JSON.stringify(history));
            }
            const btn = document.getElementById(btnId);
            btn.classList.add('sent-btn');
            btn.innerText = 'Sent - Click to Resend';
        }

        function clearHistory() {
            if(confirm("Clear all 'Sent' history?")) {
                localStorage.removeItem('sentOrders');
                location.reload();
            }
        }

        function generateLetters() {
            const input = document.getElementById('orderInput').value;
            const container = document.getElementById('letterContainer');
            const alertBox = document.getElementById('duplicateAlert');
            const history = getHistory();
            
            container.innerHTML = '';
            alertBox.classList.add('hidden');

            // Find all instances of ORD-XX-XXXXX
            const orderRegex = /(ORD-\d{2}-\d{5})/g;
            const matches = [...input.matchAll(orderRegex)];
            
            if (matches.length === 0) {
                alert("No Order Numbers found. Try pasting the text from your PDF.");
                return;
            }

            let foundDuplicates = false;

            matches.forEach((match, index) => {
                const orderId = match[0];
                const btnId = `btn-${index}`;
                
                if (history.includes(orderId)) foundDuplicates = true;

                // Simple logic: look at the text immediately following the order number
                const context = input.substring(match.index, match.index + 500);
                
                let links = [];
                for (const [key, urls] of Object.entries(resourceMap)) {
                    if (context.includes(key)) {
                        urls.forEach(u => links.push(`${key}: ${u}`));
                    }
                }

                const linkText = links.length > 0 ? links.join('\\n') : "General Resources";
                
                const subject = `${orderId} BinMaster Support Resources`;
                const body = `Thanks again for choosing BinMaster for your state-of-the-art level measurement system. Looking ahead to your system, we figure you could use some resources.\\n\\n${linkText}\\n\\nRemember to bookmark https://support.binmaster.com/ if you need to chat, search our knowledge base, or contact BinMaster Tech. Protip: Water and sensors do not mix. Check your seals. Anticipate water intrusion from conduits. Ask your installer to double check.\\n\\nBinMaster Technical Support Team\\n402-434-9105`;

                const card = document.createElement('div');
                card.className = "p-6 border rounded-lg bg-gray-50 shadow-sm";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <h3 class="text-xl font-bold text-blue-800">${orderId}</h3>
                        <a href="mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}" 
                           id="${btnId}"
                           onclick="markAsSent('${orderId}', '${btnId}')"
                           class="px-4 py-2 rounded text-white font-bold transition ${history.includes(orderId) ? 'sent-btn' : 'bg-blue-500 hover:bg-blue-600'}">
                           ${history.includes(orderId) ? 'Sent - Click to Resend' : 'Prepare Email'}
                        </a>
                    </div>
                    <pre class="text-xs text-gray-700 whitespace-pre-wrap bg-white p-3 border rounded">${body}</pre>
                `;
                container.appendChild(card);
            });

            if (foundDuplicates) alertBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
