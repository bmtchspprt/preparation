<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BinMaster Letter Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .sent-btn { background-color: #059669 !important; border-color: #059669 !important; }
        pre { white-space: pre-wrap; font-family: ui-sans-serif, system-ui, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-lg">
        <h1 class="text-2xl font-bold mb-2 text-blue-900">BinMaster Letter Builder</h1>
        <p class="text-sm text-gray-600 mb-6">Enhanced Search: Now detects "bmrx, cncr, gateway" correctly regardless of punctuation or case.</p>
        
        <textarea id="input" rows="8" class="w-full p-4 border-2 border-gray-200 rounded-lg mb-4 outline-none focus:border-blue-500" placeholder="Paste order data here..."></textarea>
        <button onclick="build()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition shadow">Generate Emails</button>

        <div id="results" class="mt-8 space-y-6"></div>
    </div>

    <script>
        const resourceMap = {
            "BMRX": ["• Rotary Manual: https://support.binmaster.com/kb/view/66e6b142-438c-4f2f-85c2-bda53cba000f", "• Rotary scenarios: https://support.binmaster.com/kb/view/809dda8f-1de8-44ae-af07-fe2865c03113"],
            "CNCR": ["• Manual: https://support.binmaster.com/kb/view/d71297d9-77ac-49f8-97a4-6d183bf3adbc", "• Wiring: https://support.binmaster.com/kb/view/9ab4c1b8-9795-4e4a-90a7-192da74a5729", "• Distance explanation: https://support.binmaster.com/kb/view/354aa685-9ca4-429e-bc12-c8133f120720", "• Vessel Measurement Form: https://support.binmaster.com/kb/view/d65c70fd-45a6-4720-9db6-de9f61348bae"],
            "Gateway": ["• Manual: https://binmaster.com/network-devices"],
            "NCR": ["• Manual: https://support.binmaster.com/kb/view/bc8e6a67-a401-4bc6-aa83-3423a0282860", "• Wiring: https://support.binmaster.com/kb/view/a5d3b4e0-a336-43f4-94f4-962eeef7d7af", "• Distance explanation: https://support.binmaster.com/kb/view/354aa685-9ca4-429e-bc12-c8133f120720"],
            "BinCloud": ["• Video: https://support.binmaster.com/kb/view/8f64f604-a14e-4e36-8cba-4d01bc248b99", "• Firewall Rules: https://support.binmaster.com/kb/view/6eba9a1b-a15f-4ef6-b96b-c50478438d5d"],
            "3D Scanner": ["• 3D Wiring: https://support.binmaster.com/kb/view/52912f26-04f4-4aeb-b3ba-10db7226afcd", "• 3D Manual: https://support.binmaster.com/kb/view/c33bfffd-6111-4b65-961c-17a2b1797374"],
            "ProCap": ["• ProCap Manual: https://support.binmaster.com/kb/view/4895275b-1f7c-4b28-8fec-925faa017f46", "• ProCap Wiring: https://support.binmaster.com/kb/view/c67bbd67-e00b-46ef-9f72-38a83856a103"]
        };

        function build() {
            const text = document.getElementById('input').value;
            const container = document.getElementById('results');
            container.innerHTML = '';
            const history = JSON.parse(localStorage.getItem('sent_log') || '[]');

            const parts = text.split(/(ORD-\d{2}-\d{5})/g);
            
            for (let i = 1; i < parts.length; i += 2) {
                const ordNum = parts[i];
                const content = parts[i+1] || "";
                let foundLinks = [];
                let itemsList = [];
                
                // Flexible Global Search logic
                for (const [key, links] of Object.entries(resourceMap)) {
                    const upperContent = content.toUpperCase();
                    const upperKey = key.toUpperCase();

                    // Specifically separate NCR and CNCR
                    if (upperKey === "NCR") {
                        if (upperContent.includes("NCR") && !upperContent.includes("CNCR")) {
                            itemsList.push(key);
                            links.forEach(l => foundLinks.push(l));
                        }
                    } else if (upperContent.includes(upperKey)) {
                        itemsList.push(key);
                        links.forEach(l => foundLinks.push(l));
                    }
                }

                const itemsFoundStr = [...new Set(itemsList)].join(', ');
                const linksStr = [...new Set(foundLinks)].join('\n');
                const customerMatch = content.match(/[A-Za-z ]{3,}/);
                const customer = customerMatch ? customerMatch[0].trim() : "Customer";

                const subject = `${ordNum} ${customer}`;
                const body = `${itemsFoundStr}\n\nGreetings!\n\nThanks again for choosing BinMaster for your state-of-the-art level measurement system. Looking ahead to your system, we figure you could use some resources.\n\n${linksStr}\n\nRemember to bookmark https://support.binmaster.com/ if you need to chat, search our knowledge base, or contact BinMaster Tech. Protip: Water and sensors do not mix. Check your seals. Anticipate water intrusion from conduits. Ask your installer to double check.\n\nBINMASTER TECHNICAL SUPPORT TEAM\n402-434-9105\ntechnicalsupport@binmaster.com\nsupport.binmaster.com`;

                const isSent = history.includes(ordNum);
                const btnId = `btn-${i}`;
                const card = document.createElement('div');
                card.className = "p-6 border-2 border-gray-100 rounded-xl bg-gray-50 mb-6 shadow-sm";
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="font-bold text-lg text-blue-800">${ordNum} - ${customer}</h2>
                        <button id="${btnId}" onclick="sendMail('${ordNum}', \`${encodeURIComponent(subject)}\`, \`${encodeURIComponent(body)}\`, '${btnId}')" 
                                class="px-6 py-2 rounded-lg text-white font-bold transition ${isSent ? 'sent-btn' : 'bg-blue-600 hover:bg-blue-700'}">
                            ${isSent ? 'Sent - Resend?' : 'Open Email'}
                        </button>
                    </div>
                    <pre class="text-sm border p-4 bg-white rounded-lg text-gray-700 leading-relaxed">${body}</pre>
                `;
                container.appendChild(card);
            }
        }

        function sendMail(id, sub, body, btnId) {
            window.location.href = `mailto:?subject=${sub}&body=${body}`;
            let history = JSON.parse(localStorage.getItem('sent_log') || '[]');
            if (!history.includes(id)) {
                history.push(id);
                localStorage.setItem('sent_log', JSON.stringify(history));
            }
            const btn = document.getElementById(btnId);
            btn.classList.add('sent-btn');
            btn.innerText = 'Sent - Resend?';
        }
    </script>
</body>
</html>
